<ion-content class="register-content">

  <div class="register-page">

    <!-- Theme Toggle -->
    <div style="display: flex; justify-content: flex-end; padding: 8px 0;">

      <ion-button
        fill="clear"
        style="--padding-start: 0; --padding-end: 0; width: 44px; height: 44px; --color: var(--app-text-secondary, #666);"
        type="button"
        (click)="toggleTheme()">

        <ion-icon
          [name]="isDarkMode ? 'moon-outline' : 'sunny-outline'"
          style="font-size: 22px;">
        </ion-icon>

      </ion-button>

    </div>


    <!-- Top Branding -->
    <div class="brand-section">

      <div class="logo">
        <img src="/assets/icon/OmFin-logo.png" alt="OmFin">
      </div>

      <h1>OmFin</h1>
      <p>Create your account and take control of your finances.</p>

    </div>


    <!-- =========================================
         REGISTER FORM
         ========================================= -->

    <div class="register-section">

      <form (ngSubmit)="register()">

        <!-- Email -->
        <div class="input-group">

          <ion-label>Email address</ion-label>

          <ion-item lines="none" class="input-item">
            <ion-icon
              slot="start"
              name="mail-outline">
            </ion-icon>

            <ion-input
              type="email"
              placeholder="you@example.com"
              [(ngModel)]="email"
              name="email"
              autocomplete="email"
              inputmode="email"
              required>
            </ion-input>
          </ion-item>

        </div>


        <!-- Password -->
        <div class="input-group">

          <ion-label>Password</ion-label>

          <ion-item lines="none" class="input-item">

            <ion-icon
              slot="start"
              name="lock-closed-outline">
            </ion-icon>

            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Choose a password"
              [(ngModel)]="password"
              name="password"
              autocomplete="new-password"
              required>
            </ion-input>

            <ion-button
              slot="end"
              fill="clear"
              class="password-toggle"
              type="button"
              (click)="togglePassword()">

              <ion-icon
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
              </ion-icon>

            </ion-button>

          </ion-item>

        </div>


        <!-- Confirm Password -->
        <div class="input-group">

          <ion-label>Confirm Password</ion-label>

          <ion-item lines="none" class="input-item">

            <ion-icon
              slot="start"
              name="lock-closed-outline">
            </ion-icon>

            <ion-input
              [type]="showConfirmPassword ? 'text' : 'password'"
              placeholder="Re-enter your password"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              autocomplete="new-password"
              required>
            </ion-input>

            <ion-button
              slot="end"
              fill="clear"
              class="password-toggle"
              type="button"
              (click)="toggleConfirmPassword()">

              <ion-icon
                [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'">
              </ion-icon>

            </ion-button>

          </ion-item>

        </div>


        <!-- Create Account -->
        <ion-button
          expand="block"
          type="submit"
          class="register-button"
          [disabled]="isLoading || isGoogleLoading">

          {{ isLoading ? 'Creating account...' : 'Create Account' }}

        </ion-button>

      </form>


      <!-- OR Divider -->
      <div class="or-divider">
        <span>OR</span>
      </div>


      <!-- Continue with Google -->
      <ion-button
        expand="block"
        fill="outline"
        class="google-button"
        type="button"
        [disabled]="isLoading || isGoogleLoading"
        (click)="continueWithGoogle()">

        <ion-icon slot="start" name="logo-google"></ion-icon>

        {{ isGoogleLoading ? 'Signing in...' : 'Continue with Google' }}

      </ion-button>

    </div>


    <!-- Bottom Link -->
    <div class="bottom-section">

      <p>
        Already have an account?
        <button
          class="login-link"
          type="button"
          (click)="goToLogin()">
          Login
        </button>
      </p>

    </div>


    <!-- =========================================
         REGISTER ERROR / INFO TOAST
         ========================================= -->

    <ion-toast
      [isOpen]="isToastOpen"
      [message]="toastMessage"
      [duration]="3000"
      position="bottom"
      cssClass="register-error-toast"
      (didDismiss)="isToastOpen = false">
    </ion-toast>

  </div>

</ion-content>
